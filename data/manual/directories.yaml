# 不能自动抓取、需要自己去看的网站（条款禁止抓取 / 需要登录 / 有验证码 / 只通过邮件通知）
- name: Volunteer Toronto
  url: https://www.volunteertoronto.ca/
  what: Toronto's largest volunteer job board — hundreds of roles across the city.
  what_zh: 多伦多最大的志愿岗位平台，全市数百个岗位。
  why: Blocks automated access.
  why_zh: 网站禁止自动抓取。
- name: City of Toronto — Tree Planting & Stewardship calendar
  url: https://www.toronto.ca/community-people/get-involved/volunteer-with-the-city/tree-planting-stewardship/tree-planting-stewardship-events-calendar/
  what: Free drop-in tree planting events in city parks, spring to fall.
  what_zh: 市政府公园里的植树活动，春季到秋季。
  why: Calendar is protected by a captcha.
  why_zh: 日历有验证码保护。
- name: Eventbrite — Toronto volunteer events
  url: https://www.eventbrite.ca/d/canada--toronto/volunteer/
  what: Many groups (TRCA, LEAF, clean-ups) post sign-ups here.
  what_zh: 很多机构（TRCA、LEAF、清洁活动等）在这里开放报名。
  why: Terms of service prohibit scraping.
  why_zh: 服务条款禁止抓取。
- name: Meetup — volunteer groups in Toronto
  url: https://www.meetup.com/find/?keywords=volunteer&location=ca--on--Toronto
  what: Community groups that meet regularly to volunteer.
  what_zh: 定期组织志愿活动的社区小组。
  why: Terms of service prohibit scraping.
  why_zh: 服务条款禁止抓取。
- name: Evergreen Brick Works
  url: https://www.evergreen.ca/take-action/volunteer/
  what: Ravine stewardship, gardens and events; shifts booked online.
  what_zh: 山谷自然管护、花园和活动；在线预约班次。
  why: Shift schedule requires login.
  why_zh: 班次表需要登录才能看。
- name: Toronto Nature Stewards
  url: https://torontonaturestewards.org/get-involved/
  what: Weekly stewardship at parks across the city.
  what_zh: 全市各公园每周的自然管护。
  why: Schedules are shared by email after sign-up.
  why_zh: 报名后才通过邮件发时间表。
- name: 10,000 Trees for the Rouge
  url: https://www.10000trees.com/
  what: Big community tree planting days in Rouge National Urban Park.
  what_zh: 胭脂河国家城市公园的大型社区植树日。
  why: Announced a few times a year; check the site.
  why_zh: 一年只公布几次，请直接看网站。
- name: Toronto Public Library — volunteering
  url: https://www.torontopubliclibrary.ca/support-us/volunteering/
  what: Library programs including youth volunteer roles.
  what_zh: 图书馆志愿项目，包括青少年岗位。
  why: No public feed.
  why_zh: 没有公开数据源。
- name: Ontario Volunteer Centre Network
  url: https://ovcn.ca/
  what: Find the volunteer centre for your city across Ontario.
  what_zh: 查找安省各城市的志愿者中心。
  why: Directory only.
  why_zh: 只是目录。
- name: 211 Central
  url: https://211central.ca/
  what: Search community services, including food banks and meal programs.
  what_zh: 查询社区服务，包括食物银行和免费餐。
  why: Data requires a licence.
  why_zh: 数据需要授权。
- name: Toronto Drop-In Network
  url: https://tdin.ca/
  what: Drop-in centres with free meals and services.
  what_zh: 提供免费餐和服务的日间中心。
  why: No public feed.
  why_zh: 没有公开数据源。
