- id: daily-bread-food-bank
  org: Daily Bread Food Bank
  title: Individual Volunteering
  title_zh: 个人志愿服务
  category: food-bank
  url: https://www.dailybread.ca/get-involved/volunteer/individual-volunteering/
  signup_url: https://dailybread.volunteerhub.com/vv2/lp/infosession
  min_age: 15
  credit: stated
  schedule: 'Weekdays: 8:30am - 11:30am or 12:30pm - 3:30pm (sorting/kitchen); 9:00am - 12:00pm, 1:00pm - 4:00pm, 4:00pm - 5:30pm (picking); 8:30am - 4:30pm (admin); weekday and weekend shifts for food
    bank; most shifts are 3 hours long'
  schedule_zh: 工作日：8:30–11:30 或 12:30–15:30（食品分拣/厨房）；9:00–12:00、13:00–16:00、16:00–17:30（配货）；8:30–16:30（行政）；食品库提供工作日及周末班次；多数班次时长为3小时
  area: 191 New Toronto Street, South Etobicoke, Toronto
  notes: Some sorting shifts accept ages 15+; most roles are 18+. High school students can earn volunteer hours.
  notes_zh: 部分分拣班次 15 岁以上可参加，多数岗位须 18 岁以上；高中生可以累计志愿时长。
  last_verified: '2026-10-13'
  sources:
  - https://www.dailybread.ca/get-involved/volunteer/individual-volunteering/
  - https://www.dailybread.ca/get-involved/volunteer/
- id: second-harvest
  org: Second Harvest
  title: Volunteer Program
  title_zh: 志愿服务项目
  category: food-bank
  url: https://www.secondharvest.ca/get-involved/volunteer
  signup_url: https://www.secondharvest.ca/form/volunteer-form
  min_age: null
  credit: not-stated
  schedule: Flexible for administrative and Community Champion roles (minimum 6-month commitment); 3-4 hours Mondays through Thursdays (Feeding Our Future); 3 hours Tuesdays through Thursdays (Food Sort
    Team Leader); event shift times vary
  schedule_zh: 行政和社区倡导者角色时间灵活（需承诺至少6个月）；未来营养计划为周一至周四每次3-4小时；食品分拣领队为周二至周四每次3小时；活动班次时间视具体活动而定
  area: Toronto, ON
  notes: Volunteers assist Second Harvest in rescuing surplus food and reducing food waste through warehouse support, food sorts, summer lunch prep, and community events.
  notes_zh: 志愿者通过仓库支持、食品分拣、夏季午餐制作和社区活动，协助第二收获救援过剩食品并减少食物浪费。
  last_verified: '2026-10-13'
  sources:
  - https://www.secondharvest.ca/get-involved/volunteer
