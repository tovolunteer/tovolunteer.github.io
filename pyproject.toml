[project]
name = "toronto-volunteer-hub"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12", "pyyaml>=6.0", "playwright>=1.47"]

[dependency-groups]
dev = ["ruff>=0.6", "pyright>=1.1.380", "pytest>=8", "pytest-cov>=5", "types-pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toronto_volunteer_hub"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
