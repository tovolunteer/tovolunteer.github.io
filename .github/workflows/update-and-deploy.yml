name: update-and-deploy

on:
  schedule:
    - cron: "0 10,22 * * *" # ~06:00 / 18:00 Toronto (EDT); 05:00 / 17:00 in winter
  push:
    branches: [main]
    paths: ["site/**", "data/manual/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  scrape:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - run: uv run playwright install --with-deps chromium
      - id: run
        run: |
          set +e
          uv run python -m toronto_volunteer_hub.runner --out data/auto
          echo "rc=$?" >> "$GITHUB_OUTPUT"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Geocode addresses
        run: uv run python -m toronto_volunteer_hub.geocode
        continue-on-error: true
      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auto data/geo
          git diff --cached --quiet || (git commit -m "data: auto update $(date -u +%FT%TZ)" && git push)
      - name: Open issue on source failure
        if: steps.run.outputs.rc == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          errs=$(jq -r 'select(.status=="error") | "- \(.source): \(.error)"' data/auto/*.json)
          title="Source fetch failed $(date -u +%F)"
          gh issue list --state open --search "$title in:title" --json number -q '.[0].number' | grep -q . \
            || gh issue create --title "$title" --body "$errs"

  deploy:
    needs: scrape
    if: always() && (needs.scrape.result == 'success' || needs.scrape.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run build
        working-directory: site
        env:
          PUBLIC_DISCORD_URL: ${{ vars.DISCORD_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
